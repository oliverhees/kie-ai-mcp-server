# Coolify deploy for the Streamable HTTP MCP transport (oliverhees fork).
# In Coolify: New Resource → Docker Compose → point at this file.
#
# Works with BOTH the old 3.x variable names and the new upstream names:
#   token:  MCP_AUTH_TOKEN (old)  or  KIE_MCP_HTTP_TOKEN (new)
#   domain: MCP_ALLOWED_HOSTS is derived from the Coolify domain
#           (SERVICE_FQDN_KIEAIMCP_3000) when you do not set it yourself.
# The server refuses to start without a token, because it listens publicly.
services:
  kie-ai-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify generates the public domain for port 3000 and injects it here.
      - SERVICE_FQDN_KIEAIMCP_3000
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=3000
      - KIE_AI_API_KEY=${KIE_AI_API_KEY}
      # Bearer token. Set ONE of the two in Coolify (old name still works).
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - KIE_MCP_HTTP_TOKEN=${KIE_MCP_HTTP_TOKEN:-}
      # Optional: comma-separated Host allowlist. Empty = Coolify domain.
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      # Direct media tools (gpt_image_2, kling_video, ...) like the 3.x fork.
      # Set to false to require prepare -> approve -> submit for every paid job.
      - KIE_AI_ALLOW_DIRECT_GENERATION=${KIE_AI_ALLOW_DIRECT_GENERATION:-true}
      - KIE_AI_DB_PATH=/data/tasks.db
      - KIE_AI_CALLBACK_URL=${KIE_AI_CALLBACK_URL:-}
      - NODE_ENV=production
    volumes:
      # Same volume name as the 3.x fork, so task history survives the upgrade.
      - kie-ai-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  kie-ai-data:
